name: Build and Release Extension

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Release version"
                required: true
                default: "v1.0.0"

jobs:
    build-extension:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: extension/package-lock.json

            - name: Install dependencies
              working-directory: ./extension
              run: npm ci

            - name: Create config.ts with secrets
              working-directory: ./extension/src
              run: |
                  cat > config.ts << 'EOF'
                  /**
                   * Production Configuration - Auto-generated by CI/CD
                   * DO NOT EDIT MANUALLY
                   */

                  export interface APIConfig {
                    baseUrl: string;
                    apiKey: string;
                    endpoints: {
                      context: string;
                      insights: string;
                      health: string;
                    };
                  }

                  export interface RateLimitConfig {
                    maxRequestsPerMinute: number;
                    maxRequestsPerHour: number;
                    minIntervalMs: number;
                  }

                  export const API_CONFIG: APIConfig = {
                    baseUrl: "${{ secrets.AWS_API_BASE_URL }}",
                    apiKey: "${{ secrets.AWS_API_KEY }}",
                    endpoints: {
                      context: "",
                      insights: "",
                      health: "",
                    },
                  };

                  API_CONFIG.endpoints.context = `${API_CONFIG.baseUrl}/context`;
                  API_CONFIG.endpoints.insights = `${API_CONFIG.baseUrl}/insights`;
                  API_CONFIG.endpoints.health = `${API_CONFIG.baseUrl}/health`;

                  export const RATE_LIMITS: RateLimitConfig = {
                    maxRequestsPerMinute: 5,
                    maxRequestsPerHour: 20,
                    minIntervalMs: 12000,
                  };
                  EOF

            - name: Build extension
              working-directory: ./extension
              run: npm run build

            - name: Create release package
              working-directory: ./extension
              run: |
                  mkdir -p release
                  zip -r release/noro-extension.zip \
                    dist/ \
                    manifest.json \
                    popup.html \
                    history.html \
                    public/ \
                    -x "*/node_modules/*" "*/src/*" "*/*.ts" "*/.git/*"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: noro-extension
                  path: extension/release/noro-extension.zip
                  retention-days: 90

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  files: extension/release/noro-extension.zip
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Security Check - Verify no secrets in artifact
              working-directory: ./extension
              run: |
                  echo "Checking for hardcoded secrets in source files..."
                  if grep -r "ut1o1IdqSJ" src/ 2>/dev/null; then
                    echo "❌ ERROR: Hardcoded API key found in source!"
                    exit 1
                  fi
                  echo "✅ No hardcoded secrets found in source"
